<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태화강 십리대숲 힐링 산책 공간</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Standalone Three.js Global Library (file:// 직접 열기 및 웹 호스팅 완벽 지원) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3D WebGL 캔버스 -->
  <canvas id="webgl-canvas"></canvas>

  <!-- 오버레이 UI 컨테이너 -->
  <div id="ui-container">
    <!-- 상단 바 -->
    <header class="top-bar">
      <div class="title-box">
        <h1>🎋 태화강 십리대숲</h1>
        <p>조용한 대나무 숲길 산책과 바람소리 힐링</p>
      </div>

      <div class="controls-hint">
        <span><span class="key-tag">W</span><span class="key-tag">A</span><span class="key-tag">S</span><span class="key-tag">D</span> 산책하기</span>
        <span><span class="key-tag">마우스 드래그</span> 시점 둘러보기</span>
        <span><span class="key-tag">E</span> 벤치 앉기</span>
      </div>

      <button id="btn-audio-toggle" class="btn-icon">🔊 소리 켜기</button>
    </header>

    <!-- 벤치 접근 인터랙션 프롬프트 -->
    <div id="bench-prompt" class="prompt-tooltip hidden">
      <span class="key-tag">E</span> 벤치에 앉아 쉬어가기
    </div>

    <!-- 벤치 착석 시 하단 힐링 메뉴 -->
    <div id="bench-modal" class="bench-modal hidden">
      <button id="btn-wind" class="action-btn">
        🍃 바람소리 감상하기
      </button>

      <button id="btn-meditate" class="action-btn">
        👁️ 눈감기 (명상)
      </button>

      <button id="btn-stand" class="action-btn stand-btn">
        🚶 일어나기
      </button>
    </div>

    <!-- 눈감기 (명상 모드) 전체화면 오버레이 -->
    <div id="meditation-overlay" class="meditation-overlay hidden">
      <div class="breathing-circle-container">
        <div class="breathing-circle"></div>
        <div id="breathing-guide-text" class="breathing-text">숨을 들이쉽니다...</div>
      </div>

      <div class="meditation-quote">
        "마음을 가라앉히고, 댓잎을 스치는 바람과 잔잔한 태화강 물소리에 귀를 기울여 보세요."
        <span>(ESC 또는 아래 버튼을 눌러 눈을 뜰 수 있습니다)</span>
      </div>

      <button id="btn-exit-meditate" class="exit-meditate-btn">
        눈뜨기
      </button>
    </div>
  </div>

  <!-- 호흡 가이드 텍스트 타이머 스크립트 -->
  <script>
    const guideText = document.getElementById('breathing-guide-text');
    let breathPhase = 0;
    setInterval(() => {
      const overlay = document.getElementById('meditation-overlay');
      if (overlay && overlay.classList.contains('active')) {
        breathPhase = (breathPhase + 1) % 3;
        if (breathPhase === 0) guideText.textContent = "숨을 천천히 들이쉽니다...";
        else if (breathPhase === 1) guideText.textContent = "잠시 숨을 머금습니다...";
        else guideText.textContent = "가만히 숨을 내쉽니다...";
      }
    }, 3000);
  </script>

  <!-- 메인 애플리케이션 번들 (file:// 직접 더블클릭 실행 지원) -->
  <script src="app.js"></script>
</body>
</html>
